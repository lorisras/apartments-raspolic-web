# Na svaki push na granu main: test, build i prijenos dist/ na Plus Hosting preko FTPS-a.
# Potrebne tajne (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    npr. ftp.apartments-raspolic.com
#   FTP_USERNAME  FTP račun čija je početna mapa public_html (cPanel → FTP Accounts)
#   FTP_PASSWORD
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prijenos na hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          # Ne briše ništa što nije sam prenio; web-podaci/ je ionako izvan public_html.
          exclude: |
            **/.git*
            **/.git*/**
