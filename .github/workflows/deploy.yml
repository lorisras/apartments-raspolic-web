# Na svaki push na main: testovi, build i paket za ručni prijenos na hosting.
# Paket: Actions → zadnje pokretanje → dolje „Artifacts“ → web-za-hosting
# (Plus Hosting nema uključen FTPS, pa se web prenosi ručno kroz cPanel File Manager.)
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Paket za hosting
        uses: actions/upload-artifact@v4
        with:
          name: web-za-hosting
          path: dist/
          include-hidden-files: true
          retention-days: 30
